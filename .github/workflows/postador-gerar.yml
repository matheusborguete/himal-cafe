# Gera um post por dia e manda para aprovação no Telegram.
name: "Postador: gerar post"

on:
  schedule:
    - cron: "0 12 * * *"   # 12h UTC = 9h em Brasília
  workflow_dispatch:        # botão "Run workflow" para rodar na hora

permissions:
  contents: write           # para salvar a imagem e o estado no repositório

concurrency: postador       # nunca roda junto com o verificar

jobs:
  gerar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: postador
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: |
          git config user.name "postador-himal"
          git config user.email "postador-himal@users.noreply.github.com"
      - run: node gerar.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
