# Confere o Telegram: se você clicou em Aprovar, publica no Instagram.
# É a "rede de segurança" para cliques fora das 4 horas de escuta do workflow
# gerar. O GitHub não garante o intervalo: em horários cheios pode passar horas sem rodar.
name: "Postador: verificar aprovações"

on:
  schedule:
    - cron: "*/10 * * * *"  # a cada 10 min (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:

permissions:
  contents: write

concurrency: postador

jobs:
  verificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: postador
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: |
          git config user.name "postador-himal"
          git config user.email "postador-himal@users.noreply.github.com"
      - run: node verificar.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
